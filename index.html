<!doctype html>

    <meta

    <meta name="theme-color" content="#bf9f62" />

              src="assets/crest.png"

              data-fallback="BS"
              width="220"
              height="290"
            />

            <span class="twinkle t1" aria-hidden="true"></span>
            <span class="twinkle t2" aria-hidden="true"></span>
            <span class="twinkle t3" aria-hidden="true"></span>
          </div>

          <h1 class="wordmark-wrap">

              class="wordmark"
              src="assets/wordmark.png"
